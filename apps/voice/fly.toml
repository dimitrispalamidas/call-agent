app = "call-agent-voice"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  # Build context is repo root (set via fly deploy --dockerfile apps/voice/Dockerfile --config apps/voice/fly.toml from root)

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
